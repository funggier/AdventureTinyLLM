[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adventure-tiny-llm"
version = "0.1.0"
description = "Tiny randomly initialized Transformer policy for AIAdventureRPG experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "funggier"}]
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
